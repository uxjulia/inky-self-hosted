services:
  inky-api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      INKY_DATABASE_URL: sqlite:////data/inky.db
      INKY_DATA_DIR: /data
      INKY_MOUNTED_LIBRARY_DIR: /library
      INKY_AUTH_USERNAME: ${INKY_AUTH_USERNAME:-}
      INKY_AUTH_PASSWORD: ${INKY_AUTH_PASSWORD:-}
      INKY_AUTH_REALM: ${INKY_AUTH_REALM:-Inky}
    volumes:
      - inky-data:/data
      - ${INKY_MOUNTED_LIBRARY_DIR:-./library}:/library:ro
  inky-web:
    build:
      context: ./frontend
      args:
        VITE_INKY_APP_MODE: ${VITE_INKY_APP_MODE:-self-hosted}
        VITE_INKY_DICTIONARY_TOOLS: ${VITE_INKY_DICTIONARY_TOOLS:-1}
    restart: unless-stopped
    depends_on:
      - inky-api
    ports:
      - "${INKY_PORT:-8000}:80"

volumes:
  inky-data:
