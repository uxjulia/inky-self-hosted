services:
  api:
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      INKY_DATABASE_URL: ${INKY_DATABASE_URL:-sqlite:////data/inky.db}
      INKY_DATA_DIR: ${INKY_DATA_DIR:-/data}
    volumes:
      - inky-data:/data
    ports:
      - "8000:8000"

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-3000}:80"

volumes:
  inky-data:

